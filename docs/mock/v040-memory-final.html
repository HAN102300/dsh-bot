<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆卡整合方案（A 限高滚动 + B 全量弹窗 + D 时间栏）· dsh-bot</title>
<link rel="stylesheet" href="./mock.css">
<style>
  body { background: #0b0b0d; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 24px 80px; }

  .page-title { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  .page-sub { margin: 0 0 22px; font-size: 13px; line-height: 20px; color: var(--label-3); }
  .page-sub b { color: var(--label-2); font-weight: 500; }
  .hint { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
          background: rgba(224,116,92,.12); border: 0.5px solid rgba(224,116,92,.28);
          color: var(--brand-text); font-size: 11px; font-weight: 500; }

  /* ============ 卡片骨架 ============ */
  .card { border: 0.5px solid var(--card-stroke); background: var(--card-fill); border-radius: 12px; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 0.5px solid var(--card-stroke); }
  .card-title { font-size: 15px; font-weight: 600; color: var(--label-1); }
  .card-count { font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }
  .card-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .link { font-size: 12px; color: var(--brand-text); cursor: pointer; user-select: none; }
  .link:hover { text-decoration: underline; }
  .link.quiet { color: var(--label-2); }
  .link.quiet:hover { color: var(--label-1); }

  /* ============ 记忆行：时间 | 点 | 正文 ============ */
  .card-body { padding: 4px 16px 2px; }

  .mem {
    display: grid;
    grid-template-columns: 92px 8px minmax(0, 1fr);
    gap: 10px;
    padding: 9px 0;
    border-top: 0.5px solid var(--border-l1);
    align-items: start;
  }
  .mem:first-child { border-top: 0; }

  /* 时间栏（方案 D 的核心）：等宽数字 + 固定列宽，保证纵向对齐 */
  .mem-time {
    font-size: 11px; line-height: 20px;
    color: var(--label-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: left;
    padding-top: 0;
  }
  .mem-time .d { color: var(--label-2); }
  .mem-time .t { color: var(--label-dim); }
  .mem-time .none { color: var(--label-dim); }

  .mem-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--brand); margin-top: 7px; }
  .mem-dot.pref { background: var(--warn); }
  .mem-dot.fail { background: var(--err); }

  .mem-main { min-width: 0; }
  .mem-text {
    margin: 0; font-size: 13px; line-height: 20px; color: var(--label-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer;
  }
  .mem-text.open { -webkit-line-clamp: unset; }
  .mem-text b { color: var(--label-1); font-weight: 500; }
  .mem-more { font-size: 11px; color: var(--brand-text); cursor: pointer; margin-top: 1px; display: none; }
  .mem-more.show { display: inline-block; }

  /* 类型标签（偏好才需要；事实靠圆点区分） */
  .kd {
    display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px;
    background: var(--layer-3); color: var(--label-2);
    font-size: 10px; font-weight: 500; white-space: nowrap; margin-right: 6px; vertical-align: 1px;
  }
  .kd.pref { color: var(--warn); background: rgba(224,178,92,.12); }

  /* ============ A：限高滚动 + 渐隐 ============ */
  .scrollwrap { position: relative; }
  .scrollwrap::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
    pointer-events: none; background: linear-gradient(180deg, transparent, var(--card-fill));
    opacity: 1; transition: opacity .2s;
  }
  .scrollwrap.at-bottom::after { opacity: 0; }
  .scrollbox { max-height: 258px; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
  .scrollbox::-webkit-scrollbar { width: 8px; }
  .scrollbox::-webkit-scrollbar-track { background: transparent; }
  .scrollbox::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }
  .scrollbox::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.24); }

  .card-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-top: 0.5px solid var(--card-stroke);
    font-size: 12px; color: var(--label-3);
  }
  .card-foot .grow { flex: 1; }
  .card-foot .num { font-variant-numeric: tabular-nums; }

  /* ============ B：全量弹窗 ============ */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; padding: 24px; z-index: 1000;
  }
  .backdrop.show { display: flex; }

  .modal {
    width: 100%; max-width: 620px; max-height: min(78vh, 720px);
    display: flex; flex-direction: column;
    border: 0.5px solid var(--border-l2); border-radius: 14px;
    background: var(--layer-2); box-shadow: 0 24px 64px rgba(0,0,0,.55);
    overflow: hidden;
  }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 0.5px solid var(--border-l1); flex: none; }
  .modal-head .t { font-size: 15px; font-weight: 600; color: var(--label-1); }
  .modal-head .c { font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }
  .modal-x {
    margin-left: auto; width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent;
    color: var(--label-3); cursor: pointer; display: grid; place-items: center; font-size: 15px; line-height: 1;
  }
  .modal-x:hover { background: var(--hover); color: var(--label-1); }

  .modal-tools { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 0.5px solid var(--border-l1); flex: none; flex-wrap: wrap; }
  .search { flex: 1; min-width: 180px; height: 30px; border-radius: 8px; border: 0.5px solid var(--border-l2);
            background: var(--layer-1); color: var(--label-1); font-size: 12px; padding: 0 10px; outline: none; font-family: inherit; }
  .search::placeholder { color: var(--label-dim); }
  .search:focus { border-color: var(--border-l3); }
  .chip { height: 26px; padding: 0 11px; border-radius: 999px; border: 0.5px solid var(--border-l2);
          background: transparent; color: var(--label-2); font-size: 11px; font-weight: 500;
          display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-family: inherit; }
  .chip:hover { background: var(--hover); }
  .chip.on { background: var(--layer-3); color: var(--label-1); border-color: var(--border-l3); }
  .chip .n { color: var(--label-3); font-variant-numeric: tabular-nums; }
  .chip.on .n { color: var(--label-2); }

  .modal-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 18px 12px; }
  .modal-list::-webkit-scrollbar { width: 8px; }
  .modal-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }

  .modal-foot { flex: none; padding: 10px 18px; border-top: 0.5px solid var(--border-l1);
                font-size: 11px; color: var(--label-3); display: flex; align-items: center; gap: 8px; }
  .modal-foot .grow { flex: 1; }

  .empty { padding: 28px 8px; text-align: center; font-size: 12px; color: var(--label-3); }

  /* 标注 */
  .anno { font-size: 11px; color: var(--label-dim); line-height: 17px; margin: 10px 2px 0; }
  .anno b { color: var(--label-3); font-weight: 500; }
  mark { background: rgba(224,116,92,.28); color: var(--label-1); border-radius: 3px; padding: 0 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="page-title">记忆卡整合方案</h1>
  <p class="page-sub">
    <b>A</b> 限高滚动 + 渐隐 &nbsp;·&nbsp; <b>B</b> 查看全部弹窗（搜索 + 筛选）&nbsp;·&nbsp; <b>D</b> 时间栏纵向对齐<br/>
    这张稿是<b>真的能点</b>：滚动卡片、点「查看全部」开弹窗、在弹窗里搜索和筛选、点任意一条展开全文。
  </p>
  <span class="hint">数据：真实 Bot 的 21 条事实（全部带 [MM-DD HH:mm]）+ 2 条示例偏好（无时间戳，演示占位）</span>

  <!-- ================= 详情页里的记忆卡 ================= -->
  <div style="margin-top:22px">
    <div class="card">
      <div class="card-head">
        <span class="card-title">记忆</span>
        <span class="card-count num" id="headCount"></span>
        <span class="card-right">
          <span class="link quiet" id="sortBtn">最新在前</span>
        </span>
      </div>

      <div class="card-body">
        <div class="scrollwrap" id="scrollwrap">
          <div class="scrollbox" id="scrollbox">
            <!-- 行由 JS 渲染 -->
          </div>
        </div>
      </div>

      <div class="card-foot">
        <span id="footRange"></span>
        <span class="grow"></span>
        <span class="link" id="openAll">查看全部 →</span>
      </div>
    </div>

    <p class="anno">
      <b>高度固定约 258px</b>（≈5 条），再多也只会内部滚动；底部渐隐在滚到底时自动消失。
      时间列宽 92px、等宽数字，日期与时间分两段着色，纵向严格对齐。
    </p>
  </div>

  <!-- ================= 弹窗 ================= -->
  <div class="backdrop" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-label="记忆 · 全部">
      <div class="modal-head">
        <span class="t">记忆 · 全部</span>
        <span class="c num" id="modalCount"></span>
        <button class="modal-x" id="closeBtn" aria-label="关闭">✕</button>
      </div>

      <div class="modal-tools">
        <input class="search" id="search" placeholder="搜索记忆内容（如 npm、403、stars）…" />
        <button class="chip on" data-kind="all">全部 <span class="n" id="nAll"></span></button>
        <button class="chip" data-kind="fact">事实 <span class="n" id="nFact"></span></button>
        <button class="chip" data-kind="preference">偏好 <span class="n" id="nPref"></span></button>
      </div>

      <div class="modal-list" id="modalList"></div>

      <div class="modal-foot">
        <span>Esc 关闭 · 点击任意一条展开全文</span>
        <span class="grow"></span>
        <span id="modalRange"></span>
      </div>
    </div>
  </div>
</div>

<script>
// ============ 真实数据（来自 ~/.dsh/bot/bots/bot_844f9450/semantic.json）============
const RAW_FACTS = [
  "[11-08 16:00] 本轮三项数据已全部取到（GitHub 接口恢复正常）：",
  "[11-09 04:00] 数据截至 2026-11-07｜npm 近 7 天 976｜npm 近 30 天 1871｜stars 3｜较上轮 Δ +0 / +0 / +0｜异常说明：无（GitHub 接口本轮正常返回；npm 数据窗口 end 仍为 2026-11-",
  "[11-09 16:00] 已拿到本轮三项数据，直接汇报。",
  "[11-10 04:00] 本轮三项数据已全部取回（npm 近 7 天、近 30 天与 GitHub 接口均返回 200），无需再抓。",
  "[11-11 04:00] 本轮三项数据均已取回（两个 npm 窗口与 GitHub 接口都返回 200），无需再抓取。",
  "[11-11 16:00] 本轮三项数据已全部取回，无需再抓取。",
  "[11-12 04:00] 数据截至 2026-11-10｜npm 近 7 天 969｜npm 近 30 天 2317｜stars 5｜较上轮 Δ +0 / +0 / +0｜异常说明：npm 两个窗口的 end 字段仍停留在 2026-11-10，未随本轮推进（即数据",
  "[11-12 16:00] 本轮三项数据均已取回，无需再抓。",
  "[11-13 16:00] 本轮三项数据一次抓取全部返回 200，窗口已正常推进：",
  "[11-14 16:00] 本轮三项数据已全部取回（npm 两个窗口与 GitHub 接口均返回 200，无需再抓）。",
  "[11-15 16:00] 本轮数据已全部取回（npm 两个窗口 + GitHub 接口均 200），无需再抓。",
  "[11-16 16:00] 已拿到本轮三项数据（两个 npm 窗口 + GitHub stars/forks 均返回 200），无需再抓。",
  "[11-17 16:00] GitHub 接口已重试一次，仍返回 403 限流；按纪律不再重抓，本轮 stars 项记为失败。",
  "[11-18 16:00] 数据截至 2026-11-17｜npm 近 7 天 1020｜npm 近 30 天 3337｜stars 6｜较上轮 Δ 近 7 天 −217、近 30 天 +83、stars +1（上轮 stars 缺数据，对比最近有效值 5）｜异常说明",
  "[11-19 16:00] **数据截至 2026-11-18｜npm 近 7 天 986｜npm 近 30 天 3408｜stars 6｜forks 1｜较上轮 Δ：近 7 天 -34、近 30 天 +71、stars 0、forks 首次基准｜异常说明：无，三个数",
  "[11-21 16:00] 本轮三项数据都已取回（两个 npm 窗口和 GitHub 接口均返回 200），无需再抓取。",
  "[11-22 16:00] 本轮三项数据已全部取回（两个 npm 窗口与 GitHub 接口均返回 200），无需再抓取。",
  "[11-23 16:00] 三项数据本轮已全部取回（两个 npm 窗口与 GitHub 接口均 200），直接汇报。",
  "[11-24 16:00] 三项数据已全部取回，无需再抓取。",
  "[11-25 16:00] 三项数据已全部取回（两个 npm 窗口与 GitHub 接口均返回 200），无需再抓。",
  "[11-26 16:00] 三项数据本轮已全部取回（两个 npm 窗口与 GitHub 接口均返回 200），无需再抓取。以下为本轮汇报："
];

// 偏好（该 Bot 目前为 0 条；演示时放两条，说明「无时间戳」怎么显示）
const RAW_PREFS = [
  '只抓两个数据源：npm downloads API 与 GitHub REST，不调用第三方接口。',
  '汇报格式固定为一行数字，不要写长段落。'
];

// ============ 解析：把文本里开头的 [MM-DD HH:mm] 拆成独立的时间字段 ============
// 为什么解析而不是加字段：现有 semantic.facts 是 string[]，时间戳由模型写在正文里；
// 21/21 条都符合该格式，解析即可得到可对齐的时间列，且零迁移成本。
function parseEntry(text, kind) {
  const m = text.match(/^\[(\d{2}-\d{2}) (\d{2}:\d{2})\]\s*/);
  if (m) return { day: m[1], time: m[2], body: text.slice(m[0].length), kind };
  return { day: null, time: null, body: text.trim(), kind };
}

const ALL = [
  ...RAW_FACTS.map((t) => parseEntry(t, 'fact')),
  ...RAW_PREFS.map((t) => parseEntry(t, 'preference')),
];

// 最新在前（按 day+time 倒序；无时间的排在最后）
function sortNewestFirst(list) {
  return [...list].sort((a, b) => {
    const ka = a.day ? a.day + a.time : '';
    const kb = b.day ? b.day + b.time : '';
    if (!ka && !kb) return 0;
    if (!ka) return 1;
    if (!kb) return -1;
    return kb.localeCompare(ka);
  });
}

let state = { order: 'newest', kind: 'all', q: '' };

// ============ 渲染一行 ============
function rowEl(e, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'mem';

  // 时间（未标注时间的偏好显示占位，保持列宽对齐）
  const time = document.createElement('div');
  time.className = 'mem-time';
  if (e.day) {
    time.innerHTML = '<span class="d">' + e.day + '</span> <span class="t">' + e.time + '</span>';
  } else {
    time.innerHTML = '<span class="none">—</span>';
  }

  const dot = document.createElement('div');
  dot.className = 'mem-dot' + (e.kind === 'preference' ? ' pref' : '');

  const main = document.createElement('div');
  main.className = 'mem-main';

  const p = document.createElement('p');
  p.className = 'mem-text';
  // 渲染正文：① 按 ** 分段（交替加粗）② 每段 escape ③ 命中搜索词加 <mark>
  p.innerHTML = renderBody(e.body, opts.highlight);

  const more = document.createElement('span');
  more.className = 'mem-more';
  more.textContent = '展开';

  // 点击展开/收起（仅当文本真的被截断时提示）
  p.addEventListener('click', () => {
    const open = p.classList.toggle('open');
    more.textContent = open ? '收起' : '展开';
  });

  main.appendChild(p);
  main.appendChild(more);

  if (e.kind === 'preference') {
    const kd = document.createElement('span');
    kd.className = 'kd pref';
    kd.textContent = '偏好';
    // 偏好标签放在正文前
    const line = document.createElement('p');
    line.className = p.className;
    line.innerHTML = kd.outerHTML + p.innerHTML;
    main.replaceChild(line, p);
    line.addEventListener('click', () => {
      const open = line.classList.toggle('open');
      more.textContent = open ? '收起' : '展开';
      more.classList.toggle('show', false);
    });
  }

  wrap.appendChild(time);
  wrap.appendChild(dot);
  wrap.appendChild(main);

  // 渲染后判断是否需要「展开」提示
  requestAnimationFrame(() => {
    const el = main.querySelector('.mem-text');
    if (el && el.scrollHeight > el.clientHeight + 2) more.classList.add('show');
  });

  return wrap;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/**
 * 把一条记忆的正文渲染成 HTML。
 * - 模型爱写 **强调**，要渲染成粗体，不能把星号当字面量显示
 * - 搜索命中要 <mark> 高亮；先 escape 再高亮，避免注入
 */
function renderBody(text, q) {
  // 按 ** 切段：偶数段正常、奇数段加粗
  const segs = text.split('**');
  return segs.map((seg, i) => {
    if (!seg) return '';
    const bold = i % 2 === 1;
    let html;
    if (q) {
      const lower = seg.toLowerCase();
      const needle = q.toLowerCase();
      let out = '';
      let from = 0;
      let at;
      while ((at = lower.indexOf(needle, from)) >= 0) {
        out += escapeHtml(seg.slice(from, at));
        out += '<mark>' + escapeHtml(seg.slice(at, at + needle.length)) + '</mark>';
        from = at + needle.length;
      }
      out += escapeHtml(seg.slice(from));
      html = out;
    } else {
      html = escapeHtml(seg);
    }
    return bold ? '<b>' + html + '</b>' : html;
  }).join('');
}

// ============ 卡片内列表（A）============
const scrollbox = document.getElementById('scrollbox');
const scrollwrap = document.getElementById('scrollwrap');
const CARD_ROWS = 5;

function renderCard() {
  const list = state.order === 'newest' ? sortNewestFirst(ALL) : ALL;
  scrollbox.innerHTML = '';
  list.slice(0, CARD_ROWS).forEach((e) => scrollbox.appendChild(rowEl(e)));

  document.getElementById('headCount').textContent = '共 ' + ALL.length + ' 条';
  document.getElementById('footRange').textContent =
    '显示最近 ' + Math.min(CARD_ROWS, list.length) + ' 条';
  document.getElementById('openAll').textContent = '查看全部 ' + ALL.length + ' 条 →';

  // 若不足 5 条，隐藏渐隐
  const needFade = list.length > CARD_ROWS;
  scrollwrap.classList.toggle('at-bottom', !needFade);
}

// 滚动到底 → 渐隐消失
scrollbox.addEventListener('scroll', () => {
  const atBottom = scrollbox.scrollTop + scrollbox.clientHeight >= scrollbox.scrollHeight - 4;
  scrollwrap.classList.toggle('at-bottom', atBottom);
});

// ============ 弹窗（B）============
const backdrop = document.getElementById('backdrop');
const modalList = document.getElementById('modalList');
const search = document.getElementById('search');

function filtered() {
  let list = state.order === 'newest' ? sortNewestFirst(ALL) : ALL;
  if (state.kind !== 'all') list = list.filter((e) => e.kind === state.kind);
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    list = list.filter((e) => e.body.toLowerCase().includes(q) || (e.day ?? '').includes(q));
  }
  return list;
}

function renderModal() {
  const list = filtered();
  modalList.innerHTML = '';
  if (list.length === 0) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '没有匹配的记忆';
    modalList.appendChild(d);
  } else {
    list.forEach((e) => modalList.appendChild(rowEl(e, { highlight: state.q.trim() })));
  }
  document.getElementById('modalCount').textContent = '共 ' + ALL.length + ' 条';
  document.getElementById('modalRange').textContent =
    list.length === ALL.length ? '全部 ' + list.length + ' 条' : '筛选出 ' + list.length + ' / ' + ALL.length + ' 条';
  // 计数
  document.getElementById('nAll').textContent = ALL.length;
  document.getElementById('nFact').textContent = ALL.filter((e) => e.kind === 'fact').length;
  document.getElementById('nPref').textContent = ALL.filter((e) => e.kind === 'preference').length;
}

function openModal() {
  renderModal();
  backdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(() => search.focus(), 40);
}
function closeModal() {
  backdrop.classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('openAll').addEventListener('click', openModal);
document.getElementById('closeBtn').addEventListener('click', closeModal);
backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && backdrop.classList.contains('show')) closeModal(); });

search.addEventListener('input', (e) => { state.q = e.target.value; renderModal(); });

document.querySelectorAll('.chip').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    state.kind = btn.dataset.kind;
    renderModal();
  });
});

// 排序切换
document.getElementById('sortBtn').addEventListener('click', (e) => {
  state.order = state.order === 'newest' ? 'oldest' : 'newest';
  e.target.textContent = state.order === 'newest' ? '最新在前' : '最早在前';
  renderCard();
  if (backdrop.classList.contains('show')) renderModal();
});

// 初始化
renderCard();
renderModal();

// hash 直达（便于截图/评审）：#modal 打开弹窗；#search=npm 预填搜索
if (location.hash.startsWith('#modal')) {
  openModal();
  const m = location.hash.match(/search=([^&]+)/);
  if (m) {
    const q = decodeURIComponent(m[1]);
    search.value = q;
    state.q = q;
    renderModal();
  }
}
</script>
</body>
</html>
